<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1540" viewBox="0 0 2400 1540">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#334e68"/>
    </marker>
    <style>
      .title{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .subtitle{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#334e68}
      .tbl{fill:#ffffff;stroke:#2b6cb0;stroke-width:2}
      .th{fill:#ebf8ff;stroke:#2b6cb0;stroke-width:2}
      .h{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .c{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#243b53}
      .fk{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#1f3c88}
      .legend{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#486581}
      .ln{stroke:#334e68;stroke-width:2}
    </style>
  </defs>

  <rect x="0" y="0" width="2400" height="1540" fill="#f4f8fb"/>
  <rect x="22" y="20" width="2356" height="1498" rx="18" fill="#fff" stroke="#bcccdc" stroke-width="2"/>

  <text x="58" y="84" class="title">MLD - Modèle Logique de Données (Relationnel)</text>
  <text x="58" y="118" class="subtitle">Version alignée sur la base Laravel/MySQL du projet FAL PMS</text>

  <!-- Row 1 -->
  <rect x="60" y="170" width="290" height="44" class="th"/>
  <rect x="60" y="214" width="290" height="190" class="tbl"/>
  <text x="78" y="198" class="h">users</text>
  <text x="76" y="238" class="c"># id</text>
  <text x="76" y="258" class="c">name, email, password</text>
  <text x="76" y="278" class="c">role, is_admin, is_active</text>
  <text x="76" y="298" class="c">job_title, phone</text>
  <text x="76" y="318" class="c">notify_email, notify_push</text>
  <text x="76" y="338" class="c">last_seen_at</text>
  <text x="76" y="358" class="c">created_at, updated_at</text>

  <rect x="420" y="170" width="260" height="44" class="th"/>
  <rect x="420" y="214" width="260" height="136" class="tbl"/>
  <text x="438" y="198" class="h">clients</text>
  <text x="436" y="238" class="c"># id</text>
  <text x="436" y="258" class="c">name, email, phone</text>
  <text x="436" y="278" class="c">company, address</text>
  <text x="436" y="298" class="c">created_at, updated_at</text>

  <rect x="740" y="170" width="340" height="44" class="th"/>
  <rect x="740" y="214" width="340" height="214" class="tbl"/>
  <text x="758" y="198" class="h">projects</text>
  <text x="756" y="238" class="c"># id</text>
  <text x="756" y="258" class="c">* owner_id -> users.id</text>
  <text x="756" y="278" class="c">* client_id -> clients.id</text>
  <text x="756" y="298" class="c">title, description, status</text>
  <text x="756" y="318" class="c">start_date, due_date, budget</text>
  <text x="756" y="338" class="c">priority, objective</text>
  <text x="756" y="358" class="c">is_template, archived_at</text>
  <text x="756" y="378" class="c">created_at, updated_at</text>

  <rect x="1160" y="170" width="370" height="44" class="th"/>
  <rect x="1160" y="214" width="370" height="238" class="tbl"/>
  <text x="1178" y="198" class="h">tasks</text>
  <text x="1176" y="238" class="c"># id</text>
  <text x="1176" y="258" class="c">* project_id -> projects.id</text>
  <text x="1176" y="278" class="c">* assigned_to -> users.id (nullable)</text>
  <text x="1176" y="298" class="c">title, description, status, priority</text>
  <text x="1176" y="318" class="c">start_date, due_date</text>
  <text x="1176" y="338" class="c">estimated_hours, is_in_review</text>
  <text x="1176" y="358" class="c">progress, sort_order</text>
  <text x="1176" y="378" class="c">created_by, completed_at</text>
  <text x="1176" y="398" class="c">created_at, updated_at</text>

  <rect x="1590" y="170" width="300" height="44" class="th"/>
  <rect x="1590" y="214" width="300" height="150" class="tbl"/>
  <text x="1608" y="198" class="h">project_user</text>
  <text x="1606" y="238" class="c"># id</text>
  <text x="1606" y="258" class="c">* project_id -> projects.id</text>
  <text x="1606" y="278" class="c">* user_id -> users.id</text>
  <text x="1606" y="298" class="c">role, is_active</text>
  <text x="1606" y="318" class="c">created_at, updated_at</text>

  <rect x="1950" y="170" width="300" height="44" class="th"/>
  <rect x="1950" y="214" width="300" height="150" class="tbl"/>
  <text x="1968" y="198" class="h">task_comments</text>
  <text x="1966" y="238" class="c"># id</text>
  <text x="1966" y="258" class="c">* task_id -> tasks.id</text>
  <text x="1966" y="278" class="c">* user_id -> users.id</text>
  <text x="1966" y="298" class="c">content</text>
  <text x="1966" y="318" class="c">created_at, updated_at</text>

  <!-- Row 2 -->
  <rect x="60" y="520" width="300" height="44" class="th"/>
  <rect x="60" y="564" width="300" height="150" class="tbl"/>
  <text x="78" y="548" class="h">task_subtasks</text>
  <text x="76" y="588" class="c"># id</text>
  <text x="76" y="608" class="c">* task_id -> tasks.id</text>
  <text x="76" y="628" class="c">title, is_completed</text>
  <text x="76" y="648" class="c">* completed_by -> users.id</text>
  <text x="76" y="668" class="c">completed_at</text>

  <rect x="420" y="520" width="310" height="44" class="th"/>
  <rect x="420" y="564" width="310" height="170" class="tbl"/>
  <text x="438" y="548" class="h">project_files</text>
  <text x="436" y="588" class="c"># id</text>
  <text x="436" y="608" class="c">* project_id -> projects.id</text>
  <text x="436" y="628" class="c">* task_id -> tasks.id (nullable)</text>
  <text x="436" y="648" class="c">* uploaded_by -> users.id</text>
  <text x="436" y="668" class="c">filename, path, mime, size</text>
  <text x="436" y="688" class="c">created_at, updated_at</text>

  <rect x="790" y="520" width="300" height="44" class="th"/>
  <rect x="790" y="564" width="300" height="150" class="tbl"/>
  <text x="808" y="548" class="h">project_messages</text>
  <text x="806" y="588" class="c"># id</text>
  <text x="806" y="608" class="c">* project_id -> projects.id</text>
  <text x="806" y="628" class="c">* user_id -> users.id</text>
  <text x="806" y="648" class="c">message</text>
  <text x="806" y="668" class="c">created_at, updated_at</text>

  <rect x="1150" y="520" width="300" height="44" class="th"/>
  <rect x="1150" y="564" width="300" height="170" class="tbl"/>
  <text x="1168" y="548" class="h">timesheets</text>
  <text x="1166" y="588" class="c"># id</text>
  <text x="1166" y="608" class="c">* user_id -> users.id</text>
  <text x="1166" y="628" class="c">* project_id -> projects.id</text>
  <text x="1166" y="648" class="c">* task_id -> tasks.id (nullable)</text>
  <text x="1166" y="668" class="c">hours, work_date, notes</text>
  <text x="1166" y="688" class="c">created_at, updated_at</text>

  <rect x="1510" y="520" width="290" height="44" class="th"/>
  <rect x="1510" y="564" width="290" height="130" class="tbl"/>
  <text x="1528" y="548" class="h">permissions</text>
  <text x="1526" y="588" class="c"># id</text>
  <text x="1526" y="608" class="c">name, slug</text>
  <text x="1526" y="628" class="c">description</text>
  <text x="1526" y="648" class="c">created_at, updated_at</text>

  <rect x="1860" y="520" width="300" height="44" class="th"/>
  <rect x="1860" y="564" width="300" height="150" class="tbl"/>
  <text x="1878" y="548" class="h">permission_user</text>
  <text x="1876" y="588" class="c"># id</text>
  <text x="1876" y="608" class="c">* permission_id -> permissions.id</text>
  <text x="1876" y="628" class="c">* user_id -> users.id</text>
  <text x="1876" y="648" class="c">granted_by</text>
  <text x="1876" y="668" class="c">created_at, updated_at</text>

  <!-- Row 3 -->
  <rect x="160" y="860" width="290" height="44" class="th"/>
  <rect x="160" y="904" width="290" height="130" class="tbl"/>
  <text x="178" y="888" class="h">task_tags</text>
  <text x="176" y="928" class="c"># id</text>
  <text x="176" y="948" class="c">name, color</text>
  <text x="176" y="968" class="c">created_at, updated_at</text>

  <rect x="510" y="860" width="290" height="44" class="th"/>
  <rect x="510" y="904" width="290" height="130" class="tbl"/>
  <text x="528" y="888" class="h">task_tag</text>
  <text x="526" y="928" class="c"># id</text>
  <text x="526" y="948" class="c">* task_id -> tasks.id</text>
  <text x="526" y="968" class="c">* task_tag_id -> task_tags.id</text>

  <rect x="860" y="860" width="330" height="44" class="th"/>
  <rect x="860" y="904" width="330" height="150" class="tbl"/>
  <text x="878" y="888" class="h">task_dependencies</text>
  <text x="876" y="928" class="c"># id</text>
  <text x="876" y="948" class="c">* task_id -> tasks.id</text>
  <text x="876" y="968" class="c">* depends_on_task_id -> tasks.id</text>
  <text x="876" y="988" class="c">created_at, updated_at</text>

  <rect x="1250" y="860" width="340" height="44" class="th"/>
  <rect x="1250" y="904" width="340" height="170" class="tbl"/>
  <text x="1268" y="888" class="h">notifications</text>
  <text x="1266" y="928" class="c"># id (uuid/string)</text>
  <text x="1266" y="948" class="c">type, data(json)</text>
  <text x="1266" y="968" class="c">notifiable_type, notifiable_id</text>
  <text x="1266" y="988" class="c">read_at</text>
  <text x="1266" y="1008" class="c">created_at, updated_at</text>

  <rect x="1650" y="860" width="330" height="44" class="th"/>
  <rect x="1650" y="904" width="330" height="170" class="tbl"/>
  <text x="1668" y="888" class="h">activity_logs</text>
  <text x="1666" y="928" class="c"># id</text>
  <text x="1666" y="948" class="c">* user_id -> users.id</text>
  <text x="1666" y="968" class="c">* project_id -> projects.id</text>
  <text x="1666" y="988" class="c">* task_id -> tasks.id (nullable)</text>
  <text x="1666" y="1008" class="c">action, meta(json), created_at</text>

  <!-- FK Lines -->
  <line x1="740" y1="260" x2="350" y2="260" class="ln" marker-end="url(#arrow)"/>
  <text x="520" y="250" class="fk">owner_id</text>

  <line x1="740" y1="292" x2="680" y2="292" class="ln" marker-end="url(#arrow)"/>
  <text x="684" y="282" class="fk">client_id</text>

  <line x1="1160" y1="260" x2="1080" y2="260" class="ln" marker-end="url(#arrow)"/>
  <text x="1090" y="250" class="fk">project_id</text>

  <line x1="1160" y1="280" x2="350" y2="280" class="ln" marker-end="url(#arrow)"/>
  <text x="720" y="270" class="fk">assigned_to</text>

  <line x1="1590" y1="262" x2="1080" y2="262" class="ln" marker-end="url(#arrow)"/>
  <line x1="1590" y1="282" x2="350" y2="300" class="ln" marker-end="url(#arrow)"/>

  <line x1="1950" y1="262" x2="1530" y2="262" class="ln" marker-end="url(#arrow)"/>
  <line x1="1950" y1="282" x2="350" y2="320" class="ln" marker-end="url(#arrow)"/>

  <line x1="210" y1="564" x2="1160" y2="300" class="ln" marker-end="url(#arrow)"/>
  <line x1="210" y1="644" x2="350" y2="340" class="ln" marker-end="url(#arrow)"/>

  <line x1="420" y1="610" x2="1080" y2="320" class="ln" marker-end="url(#arrow)"/>
  <line x1="420" y1="630" x2="1160" y2="340" class="ln" marker-end="url(#arrow)"/>
  <line x1="420" y1="650" x2="350" y2="350" class="ln" marker-end="url(#arrow)"/>

  <line x1="790" y1="610" x2="1080" y2="340" class="ln" marker-end="url(#arrow)"/>
  <line x1="790" y1="630" x2="350" y2="360" class="ln" marker-end="url(#arrow)"/>

  <line x1="1150" y1="610" x2="350" y2="380" class="ln" marker-end="url(#arrow)"/>
  <line x1="1150" y1="630" x2="1080" y2="360" class="ln" marker-end="url(#arrow)"/>
  <line x1="1150" y1="650" x2="1160" y2="360" class="ln" marker-end="url(#arrow)"/>

  <line x1="1860" y1="610" x2="1800" y2="610" class="ln" marker-end="url(#arrow)"/>
  <line x1="1860" y1="630" x2="350" y2="390" class="ln" marker-end="url(#arrow)"/>

  <line x1="510" y1="948" x2="1160" y2="380" class="ln" marker-end="url(#arrow)"/>
  <line x1="510" y1="968" x2="450" y2="968" class="ln" marker-end="url(#arrow)"/>

  <line x1="860" y1="948" x2="1160" y2="400" class="ln" marker-end="url(#arrow)"/>
  <line x1="860" y1="968" x2="1160" y2="420" class="ln" marker-end="url(#arrow)"/>

  <line x1="1650" y1="948" x2="350" y2="400" class="ln" marker-end="url(#arrow)"/>
  <line x1="1650" y1="968" x2="1080" y2="400" class="ln" marker-end="url(#arrow)"/>
  <line x1="1650" y1="988" x2="1160" y2="440" class="ln" marker-end="url(#arrow)"/>

  <rect x="58" y="1156" width="2290" height="334" rx="12" fill="#f0f4f8" stroke="#bcccdc"/>
  <text x="82" y="1196" class="legend">Convention : `#` clé primaire, `*` clé étrangère.</text>
  <text x="82" y="1224" class="legend">Le MLD couvre le noyau métier + modules collaboratifs avancés (tags, dépendances, timesheets, notifications).</text>
  <text x="82" y="1252" class="legend">Les tables techniques Laravel (sessions, cache, jobs, tokens, etc.) sont omises du schéma visuel pour garder la lisibilité.</text>
</svg>
