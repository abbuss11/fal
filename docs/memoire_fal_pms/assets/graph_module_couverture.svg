<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .subtitle{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#334e68}
      .axis{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#243b53}
      .val{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#1f3c88}
      .legend{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#486581}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f6f9fc"/>
  <rect x="30" y="24" width="1140" height="672" rx="16" fill="#fff" stroke="#d9e2ec" stroke-width="2"/>

  <text x="64" y="84" class="title">Couverture des modules FAL-PMS</text>
  <text x="64" y="116" class="subtitle">Source: README (17 modules)</text>

  <line x1="180" y1="180" x2="180" y2="560" stroke="#9fb3c8" stroke-width="2"/>
  <line x1="180" y1="560" x2="1080" y2="560" stroke="#9fb3c8" stroke-width="2"/>

  <text x="94" y="290" class="axis">Partiel</text>
  <rect x="180" y="256" width="794" height="48" rx="8" fill="#2f855a"/>
  <text x="990" y="287" class="val">15 / 17 (88.2%)</text>

  <text x="94" y="390" class="axis">Livré</text>
  <rect x="180" y="356" width="53" height="48" rx="8" fill="#2b6cb0"/>
  <text x="248" y="387" class="val">1 / 17 (5.9%)</text>

  <text x="76" y="490" class="axis">Roadmap</text>
  <rect x="180" y="456" width="53" height="48" rx="8" fill="#d69e2e"/>
  <text x="248" y="487" class="val">1 / 17 (5.9%)</text>

  <rect x="64" y="606" width="1072" height="62" rx="10" fill="#f0f4f8" stroke="#bcccdc"/>
  <text x="84" y="644" class="legend">Lecture: la plateforme est fonctionnelle sur le périmètre principal, avec une marge d'évolution ciblée sur les modules roadmap.</text>
</svg>
