<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#334e68"/>
    </marker>
    <style>
      .title{font:700 32px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .box{stroke-width:2;rx:12}
      .h{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .t{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#243b53}
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f6f9fc"/>
  <rect x="26" y="20" width="1348" height="860" rx="16" fill="#fff" stroke="#d9e2ec" stroke-width="2"/>
  <text x="56" y="72" class="title">Architecture fonctionnelle FAL-PMS</text>

  <rect x="70" y="130" width="240" height="170" class="box" fill="#fff7e6" stroke="#d69e2e"/>
  <text x="90" y="166" class="h">Utilisateurs</text>
  <text x="90" y="194" class="t">- Admin</text>
  <text x="90" y="216" class="t">- Project Manager</text>
  <text x="90" y="238" class="t">- Member</text>
  <text x="90" y="260" class="t">- Client</text>

  <rect x="370" y="130" width="330" height="190" class="box" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="390" y="166" class="h">Interface Client Web</text>
  <text x="390" y="194" class="t">Blade + Tailwind + Alpine</text>
  <text x="390" y="216" class="t">Dashboard, Projets, Tâches</text>
  <text x="390" y="238" class="t">Kanban, Calendrier, Timesheets</text>
  <text x="390" y="260" class="t">Commentaires, Fichiers, Chat</text>
  <text x="390" y="282" class="t">Rapports JSON/PDF</text>

  <rect x="760" y="130" width="280" height="190" class="box" fill="#f3e8ff" stroke="#6b46c1"/>
  <text x="780" y="166" class="h">Admin Filament</text>
  <text x="780" y="194" class="t">CRUD Utilisateurs/Projets/Tâches</text>
  <text x="780" y="216" class="t">Kanban Admin + Calendrier</text>
  <text x="780" y="238" class="t">Rapports + supervision</text>

  <rect x="1110" y="130" width="220" height="190" class="box" fill="#e6fffa" stroke="#2f855a"/>
  <text x="1130" y="166" class="h">API Mobile v1</text>
  <text x="1130" y="194" class="t">Auth token</text>
  <text x="1130" y="216" class="t">Projects/Tasks</text>
  <text x="1130" y="238" class="t">Notifications</text>
  <text x="1130" y="260" class="t">Timesheets</text>

  <rect x="370" y="410" width="620" height="230" class="box" fill="#f0f4f8" stroke="#7b8794"/>
  <text x="390" y="446" class="h">Backend Laravel 12 (Noyau métier)</text>
  <text x="390" y="474" class="t">Controllers Client + API + Filament Resources</text>
  <text x="390" y="496" class="t">Services: ProjectReportService, MentionResolverService, ApiTokenService</text>
  <text x="390" y="518" class="t">Sécurité: Auth, VerifyEmail, middleware permissions RBAC</text>
  <text x="390" y="540" class="t">Realtime: Events/Broadcast + notifications mail/database/push</text>
  <text x="390" y="562" class="t">Exports: JSON + PDF (DomPDF)</text>

  <rect x="90" y="700" width="430" height="130" class="box" fill="#ebf8ff" stroke="#2b6cb0"/>
  <text x="110" y="736" class="h">Base de données SQLite/MySQL</text>
  <text x="110" y="764" class="t">27 tables SQL, 30 migrations, 30 FK</text>
  <text x="110" y="786" class="t">Users, Projects, Tasks, Timesheets...</text>

  <rect x="570" y="700" width="370" height="130" class="box" fill="#fff7e6" stroke="#d69e2e"/>
  <text x="590" y="736" class="h">Stockage fichiers</text>
  <text x="590" y="764" class="t">Project files versionnés</text>
  <text x="590" y="786" class="t">Téléchargement sécurisé par droits</text>

  <rect x="990" y="700" width="340" height="130" class="box" fill="#e6fffa" stroke="#2f855a"/>
  <text x="1010" y="736" class="h">Canaux de sortie</text>
  <text x="1010" y="764" class="t">Emails, notifications in-app, push mobile</text>
  <text x="1010" y="786" class="t">Flux temps réel via broadcast</text>

  <line x1="310" y1="215" x2="370" y2="215" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="700" y1="225" x2="760" y2="225" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="1040" y1="225" x2="1110" y2="225" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>

  <line x1="540" y1="320" x2="620" y2="410" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="900" y1="320" x2="820" y2="410" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="1220" y1="320" x2="900" y2="410" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>

  <line x1="560" y1="640" x2="320" y2="700" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="700" y1="640" x2="740" y2="700" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="870" y1="640" x2="1120" y2="700" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
</svg>
