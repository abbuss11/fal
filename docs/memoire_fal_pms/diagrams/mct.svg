<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1020" viewBox="0 0 1700 1020">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#334e68"/>
    </marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .subtitle{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#334e68}
      .event{fill:#fff7e6;stroke:#d69e2e;stroke-width:2}
      .op{fill:#e6fffa;stroke:#2c7a7b;stroke-width:2}
      .res{fill:#ebf8ff;stroke:#2b6cb0;stroke-width:2}
      .head{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .txt{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#243b53}
      .flow{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#1f3c88}
      .legend{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#486581}
    </style>
  </defs>

  <rect x="0" y="0" width="1700" height="1020" fill="#f4f8fb"/>
  <rect x="24" y="20" width="1652" height="978" rx="18" fill="#fff" stroke="#bcccdc" stroke-width="2"/>

  <text x="62" y="80" class="title">MCT - Modèle Conceptuel des Traitements</text>
  <text x="62" y="114" class="subtitle">Vision "QUOI ?" indépendante de l'organisation et de la technologie</text>

  <text x="90" y="166" class="head">Événements externes</text>
  <text x="722" y="166" class="head">Opérations métier</text>
  <text x="1320" y="166" class="head">Résultats</text>

  <rect x="70" y="200" width="420" height="96" rx="10" class="event"/>
  <text x="90" y="236" class="head">E1 - Demande / besoin client</text>
  <text x="90" y="262" class="txt">Nouveau projet à structurer</text>

  <rect x="70" y="318" width="420" height="96" rx="10" class="event"/>
  <text x="90" y="354" class="head">E2 - Backlog validé</text>
  <text x="90" y="380" class="txt">Périmètre prêt pour planification</text>

  <rect x="70" y="436" width="420" height="96" rx="10" class="event"/>
  <text x="90" y="472" class="head">E3 - Ressources disponibles</text>
  <text x="90" y="498" class="txt">Membres éligibles à l'affectation</text>

  <rect x="70" y="554" width="420" height="96" rx="10" class="event"/>
  <text x="90" y="590" class="head">E4 - Signal d'exécution</text>
  <text x="90" y="616" class="txt">Mise à jour statut, commentaires, temps</text>

  <rect x="70" y="672" width="420" height="96" rx="10" class="event"/>
  <text x="90" y="708" class="head">E5 - Critères de fin atteints</text>
  <text x="90" y="734" class="txt">Toutes tâches finalisées ou projet clôturé</text>

  <rect x="620" y="196" width="470" height="100" rx="10" class="op"/>
  <text x="640" y="232" class="head">O1 - Enregistrer projet</text>
  <text x="640" y="258" class="txt">Créer le projet, définir client, objectifs, échéances</text>

  <rect x="620" y="314" width="470" height="100" rx="10" class="op"/>
  <text x="640" y="350" class="head">O2 - Planifier tâches</text>
  <text x="640" y="376" class="txt">Décomposer en tâches, priorités, dépendances</text>

  <rect x="620" y="432" width="470" height="100" rx="10" class="op"/>
  <text x="640" y="468" class="head">O3 - Affecter et notifier</text>
  <text x="640" y="494" class="txt">Associer membres aux tâches et diffuser alertes</text>

  <rect x="620" y="550" width="470" height="100" rx="10" class="op"/>
  <text x="640" y="586" class="head">O4 - Suivre l'avancement</text>
  <text x="640" y="612" class="txt">Collecter statuts, commentaires, temps et pièces jointes</text>

  <rect x="620" y="668" width="470" height="100" rx="10" class="op"/>
  <text x="640" y="704" class="head">O5 - Clôturer et capitaliser</text>
  <text x="640" y="730" class="txt">Valider livraison, archiver et produire bilan</text>

  <rect x="1240" y="200" width="390" height="96" rx="10" class="res"/>
  <text x="1260" y="236" class="head">R1 - Projet créé</text>
  <text x="1260" y="262" class="txt">Cadre initial disponible</text>

  <rect x="1240" y="318" width="390" height="96" rx="10" class="res"/>
  <text x="1260" y="354" class="head">R2 - Plan de tâches prêt</text>
  <text x="1260" y="380" class="txt">Ordonnancement exploitable</text>

  <rect x="1240" y="436" width="390" height="96" rx="10" class="res"/>
  <text x="1260" y="472" class="head">R3 - Affectations actives</text>
  <text x="1260" y="498" class="txt">Membres notifiés et engagés</text>

  <rect x="1240" y="554" width="390" height="96" rx="10" class="res"/>
  <text x="1260" y="590" class="head">R4 - Avancement consolidé</text>
  <text x="1260" y="616" class="txt">Tableau de bord à jour</text>

  <rect x="1240" y="672" width="390" height="96" rx="10" class="res"/>
  <text x="1260" y="708" class="head">R5 - Projet clôturé</text>
  <text x="1260" y="734" class="txt">Rapport final et archivage</text>

  <line x1="490" y1="248" x2="620" y2="248" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="490" y1="366" x2="620" y2="366" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="490" y1="484" x2="620" y2="484" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="490" y1="602" x2="620" y2="602" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="490" y1="720" x2="620" y2="720" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>

  <line x1="1090" y1="248" x2="1240" y2="248" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="366" x2="1240" y2="366" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="484" x2="1240" y2="484" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="602" x2="1240" y2="602" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="720" x2="1240" y2="720" stroke="#334e68" stroke-width="2.3" marker-end="url(#arrow)"/>

  <line x1="1435" y1="650" x2="1435" y2="632" stroke="#1f3c88" stroke-width="2"/>
  <line x1="1435" y1="532" x2="1435" y2="514" stroke="#1f3c88" stroke-width="2"/>
  <line x1="1435" y1="414" x2="1435" y2="396" stroke="#1f3c88" stroke-width="2"/>

  <rect x="62" y="836" width="1572" height="138" rx="10" fill="#f0f4f8" stroke="#bcccdc"/>
  <text x="86" y="874" class="legend">Synchronisation principale : (E4 OU mise à jour commentaire OU enregistrement temps) déclenche O4.</text>
  <text x="86" y="904" class="legend">R4 alimente itérativement O2/O3 tant que le projet n'est pas terminé.</text>
  <text x="86" y="934" class="legend">Le MCT ci-dessus exprime uniquement la logique métier, sans préciser les postes ni l'automatisation.</text>
</svg>
