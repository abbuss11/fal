<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .subtitle{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#334e68}
      .axis{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#243b53}
      .val{font:600 15px 'Segoe UI',Arial,sans-serif;fill:#1f3c88}
      .legend{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#486581}
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f6f9fc"/>
  <rect x="30" y="24" width="1140" height="712" rx="16" fill="#fff" stroke="#d9e2ec" stroke-width="2"/>

  <text x="64" y="84" class="title">Répartition des routes applicatives</text>
  <text x="64" y="116" class="subtitle">Source: `php artisan route:list --json` (Total = 112)</text>

  <line x1="220" y1="180" x2="220" y2="600" stroke="#9fb3c8" stroke-width="2"/>
  <line x1="220" y1="600" x2="1080" y2="600" stroke="#9fb3c8" stroke-width="2"/>

  <text x="92" y="265" class="axis">Client Web</text>
  <rect x="220" y="230" width="337" height="50" rx="8" fill="#2b6cb0"/>
  <text x="572" y="262" class="val">44 (39.3%)</text>

  <text x="110" y="355" class="axis">API v1</text>
  <rect x="220" y="320" width="123" height="50" rx="8" fill="#2f855a"/>
  <text x="358" y="352" class="val">16 (14.3%)</text>

  <text x="76" y="445" class="axis">Filament</text>
  <rect x="220" y="410" width="161" height="50" rx="8" fill="#6b46c1"/>
  <text x="396" y="442" class="val">21 (18.8%)</text>

  <text x="98" y="535" class="axis">Autres</text>
  <rect x="220" y="500" width="238" height="50" rx="8" fill="#d69e2e"/>
  <text x="473" y="532" class="val">31 (27.7%)</text>

  <rect x="64" y="634" width="1072" height="72" rx="10" fill="#f0f4f8" stroke="#bcccdc"/>
  <text x="84" y="670" class="legend">Le pôle "Client Web" représente la plus grande surface fonctionnelle, cohérent avec l'objectif collaboratif central de FAL-PMS.</text>
  <text x="84" y="695" class="legend">L'API v1 assure l'ouverture mobile/tiers sans dupliquer toute la logique métier.</text>
</svg>
