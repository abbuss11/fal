<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .subtitle{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#334e68}
      .head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .txt{font:500 16px 'Segoe UI',Arial,sans-serif;fill:#243b53}
      .small{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#486581}
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="920" fill="#f4f8fb"/>
  <rect x="34" y="26" width="1332" height="868" rx="18" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>

  <text x="70" y="86" class="title">MERISE - Vue d'ensemble (FAL PMS)</text>
  <text x="70" y="122" class="subtitle">Niveaux d'abstraction + cycle de vie</text>

  <rect x="70" y="160" width="1260" height="440" rx="12" fill="#f0f4f8" stroke="#9fb3c8"/>
  <text x="92" y="196" class="head">Niveaux d'abstraction</text>

  <rect x="90" y="222" width="360" height="54" rx="8" fill="#d9e2ec"/>
  <rect x="450" y="222" width="420" height="54" rx="8" fill="#d9e2ec"/>
  <rect x="870" y="222" width="440" height="54" rx="8" fill="#d9e2ec"/>
  <text x="110" y="257" class="head">Niveau</text>
  <text x="470" y="257" class="head">Données</text>
  <text x="890" y="257" class="head">Traitements</text>

  <rect x="90" y="286" width="360" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <rect x="450" y="286" width="420" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <rect x="870" y="286" width="440" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <text x="108" y="322" class="txt">Conceptuel (Quoi ?)</text>
  <text x="470" y="322" class="txt">MCD - Modèle Conceptuel de Données</text>
  <text x="890" y="322" class="txt">MCT - Modèle Conceptuel des Traitements</text>
  <text x="470" y="348" class="small">Indépendant des contraintes techniques</text>
  <text x="890" y="348" class="small">Événements, opérations, résultats</text>

  <rect x="90" y="386" width="360" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <rect x="450" y="386" width="420" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <rect x="870" y="386" width="440" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <text x="108" y="422" class="txt">Logique / Organisationnel</text>
  <text x="470" y="422" class="txt">MLD - Modèle Logique de Données</text>
  <text x="890" y="422" class="txt">MOT - Modèle Organisationnel des Traitements</text>
  <text x="470" y="448" class="small">Tables relationnelles, PK/FK</text>
  <text x="890" y="448" class="small">Qui ? Où ? Quand ? Manuel/Automatique</text>

  <rect x="90" y="486" width="360" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <rect x="450" y="486" width="420" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <rect x="870" y="486" width="440" height="88" rx="8" fill="#ffffff" stroke="#bcccdc"/>
  <text x="108" y="522" class="txt">Physique / Opérationnel</text>
  <text x="470" y="522" class="txt">MPD - Modèle Physique de Données</text>
  <text x="890" y="522" class="txt">MPT / MOPT - Modèle Opérationnel</text>
  <text x="470" y="548" class="small">Types SQL, index, contraintes, stockage</text>
  <text x="890" y="548" class="small">Scripts, jobs, API, exploitation réelle</text>

  <rect x="70" y="624" width="1260" height="238" rx="12" fill="#f0f4f8" stroke="#9fb3c8"/>
  <text x="92" y="660" class="head">Cycle de vie MERISE appliqué au projet</text>

  <rect x="100" y="688" width="220" height="120" rx="10" fill="#ffffff" stroke="#9fb3c8"/>
  <rect x="342" y="688" width="220" height="120" rx="10" fill="#ffffff" stroke="#9fb3c8"/>
  <rect x="584" y="688" width="220" height="120" rx="10" fill="#ffffff" stroke="#9fb3c8"/>
  <rect x="826" y="688" width="220" height="120" rx="10" fill="#ffffff" stroke="#9fb3c8"/>
  <rect x="1068" y="688" width="220" height="120" rx="10" fill="#ffffff" stroke="#9fb3c8"/>

  <text x="118" y="728" class="txt">1. Étude préalable</text>
  <text x="118" y="754" class="small">Besoins, lacunes, objectifs</text>

  <text x="360" y="728" class="txt">2. Étude détaillée</text>
  <text x="360" y="754" class="small">Règles de gestion, MCD/MCT</text>

  <text x="602" y="728" class="txt">3. Réalisation</text>
  <text x="602" y="754" class="small">MLD/MPD + développement</text>

  <text x="844" y="728" class="txt">4. Mise en oeuvre</text>
  <text x="844" y="754" class="small">Déploiement, formation</text>

  <text x="1086" y="728" class="txt">5. Maintenance</text>
  <text x="1086" y="754" class="small">Évolution continue</text>

  <line x1="320" y1="748" x2="342" y2="748" stroke="#486581" stroke-width="2"/>
  <line x1="562" y1="748" x2="584" y2="748" stroke="#486581" stroke-width="2"/>
  <line x1="804" y1="748" x2="826" y2="748" stroke="#486581" stroke-width="2"/>
  <line x1="1046" y1="748" x2="1068" y2="748" stroke="#486581" stroke-width="2"/>
