<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="760" viewBox="0 0 1360 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#334e68"/>
    </marker>
    <style>
      .h{font:700 24px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .t{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#243b53}
      .sm{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#486581}
    </style>
  </defs>
  <rect width="1360" height="760" fill="#eef3f8"/>
  <rect x="24" y="24" width="1312" height="712" rx="14" fill="#fff" stroke="#cbd5e0" stroke-width="2"/>

  <text x="56" y="72" class="h">Capture 5 - Flux mobile API v1 (Flutter)</text>

  <rect x="80" y="120" width="240" height="90" rx="10" fill="#ebf8ff" stroke="#90cdf4"/>
  <text x="100" y="155" class="sm">Application mobile</text>
  <text x="100" y="180" class="t">Flutter (token-based auth)</text>

  <rect x="430" y="120" width="300" height="90" rx="10" fill="#e6fffa" stroke="#81e6d9"/>
  <text x="450" y="155" class="sm">API Gateway Laravel</text>
  <text x="450" y="180" class="t">`/api/v1/*` + middleware api.token</text>

  <rect x="840" y="120" width="220" height="90" rx="10" fill="#fff7e6" stroke="#f6ad55"/>
  <text x="860" y="155" class="sm">Service Auth</text>
  <text x="860" y="180" class="t">ApiTokenService</text>

  <rect x="1140" y="120" width="160" height="90" rx="10" fill="#f0f4f8" stroke="#a0aec0"/>
  <text x="1160" y="155" class="sm">DB</text>
  <text x="1160" y="180" class="t">SQLite/MySQL</text>

  <line x1="320" y1="164" x2="430" y2="164" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="730" y1="164" x2="840" y2="164" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>
  <line x1="1060" y1="164" x2="1140" y2="164" stroke="#334e68" stroke-width="2.4" marker-end="url(#arrow)"/>

  <rect x="80" y="260" width="1220" height="430" rx="12" fill="#f8fafc" stroke="#d1d5db"/>

  <text x="110" y="300" class="h">Scénario de synchronisation</text>

  <rect x="110" y="328" width="1160" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="128" y="362" class="t">1) `POST /api/v1/auth/login` -> reçoit token API</text>

  <rect x="110" y="396" width="1160" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="128" y="430" class="t">2) `GET /api/v1/projects` + `GET /api/v1/tasks` -> chargement backlog mobile</text>

  <rect x="110" y="464" width="1160" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="128" y="498" class="t">3) `PATCH /api/v1/tasks/{id}/status` -> mise à jour statut depuis mobile</text>

  <rect x="110" y="532" width="1160" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="128" y="566" class="t">4) `POST /api/v1/mobile/device-token` -> activation push device</text>

  <rect x="110" y="600" width="1160" height="56" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="128" y="634" class="t">5) `GET /api/v1/notifications` + `PATCH /api/v1/notifications/{id}/read`</text>
</svg>
