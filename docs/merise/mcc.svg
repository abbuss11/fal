<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#334e68"/>
    </marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .subtitle{font:600 20px 'Segoe UI',Arial,sans-serif;fill:#334e68}
      .actor{fill:#fff;stroke:#7b8794;stroke-width:2}
      .sys{fill:#d9f2e6;stroke:#2f855a;stroke-width:2.5}
      .head{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#102a43}
      .txt{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#243b53}
      .flow{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#1f3c88}
      .legend{font:500 14px 'Segoe UI',Arial,sans-serif;fill:#486581}
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f4f8fb"/>
  <rect x="30" y="24" width="1540" height="932" rx="18" fill="#fff" stroke="#bcccdc" stroke-width="2"/>

  <text x="68" y="82" class="title">MCC - Modèle Conceptuel de Communication</text>
  <text x="68" y="116" class="subtitle">Plateforme collaborative de gestion de projets (FAL PMS)</text>

  <rect x="615" y="300" width="380" height="270" rx="18" class="sys"/>
  <text x="675" y="355" class="head">Système FAL PMS</text>
  <text x="645" y="390" class="txt">- Gestion projets et tâches</text>
  <text x="645" y="418" class="txt">- Collaboration (commentaires, fichiers)</text>
  <text x="645" y="446" class="txt">- Notifications / reporting</text>
  <text x="645" y="474" class="txt">- Historique et traçabilité</text>
  <text x="645" y="502" class="txt">- Tableau de bord</text>

  <rect x="110" y="230" width="250" height="140" rx="12" class="actor"/>
  <text x="130" y="270" class="head">Client / Product Owner</text>
  <text x="130" y="300" class="txt">Acteur externe</text>
  <text x="130" y="326" class="txt">Exprime le besoin et valide</text>

  <rect x="110" y="610" width="250" height="160" rx="12" class="actor"/>
  <text x="130" y="650" class="head">Administrateur</text>
  <text x="130" y="678" class="txt">Acteur interne</text>
  <text x="130" y="704" class="txt">Gère comptes, rôles, droits</text>
  <text x="130" y="730" class="txt">Paramètre notifications</text>

  <rect x="1210" y="230" width="280" height="160" rx="12" class="actor"/>
  <text x="1230" y="270" class="head">Chef de projet</text>
  <text x="1230" y="298" class="txt">Acteur interne</text>
  <text x="1230" y="324" class="txt">Crée projet, planifie tâches</text>
  <text x="1230" y="350" class="txt">Affecte et contrôle exécution</text>

  <rect x="1210" y="600" width="280" height="170" rx="12" class="actor"/>
  <text x="1230" y="640" class="head">Membre d'équipe</text>
  <text x="1230" y="668" class="txt">Acteur interne</text>
  <text x="1230" y="694" class="txt">Exécute tâches, commente</text>
  <text x="1230" y="720" class="txt">Déclare le temps passé</text>

  <line x1="360" y1="290" x2="615" y2="340" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="410" y="300" class="flow">Demande projet, priorités</text>

  <line x1="615" y1="395" x2="360" y2="330" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="392" y="374" class="flow">Rapports, avancement, alertes</text>

  <line x1="360" y1="680" x2="615" y2="500" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="410" y="614" class="flow">Comptes, rôles, permissions</text>

  <line x1="995" y1="350" x2="1210" y2="310" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1010" y="300" class="flow">Plans, tâches, indicateurs</text>

  <line x1="1210" y1="360" x2="995" y2="390" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1006" y="380" class="flow">Création projet, affectations</text>

  <line x1="995" y1="480" x2="1210" y2="650" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1015" y="596" class="flow">Notifications, commentaires</text>

  <line x1="1210" y1="690" x2="995" y2="520" stroke="#334e68" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1010" y="640" class="flow">Mises à jour, pièces jointes</text>

  <rect x="70" y="840" width="1460" height="88" rx="10" fill="#f0f4f8" stroke="#bcccdc"/>
  <text x="90" y="875" class="legend">Légende : le MCC décrit les flux d'information entre acteurs internes/externes et le SI, sans détailler l'implémentation technique.</text>
  <text x="90" y="903" class="legend">Acteurs internes retenus : Administrateur, Chef de projet, Membre d'équipe. Acteur externe : Client / Product Owner.</text>
</svg>
