[phases.setup]
[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.composer",
  "php83Extensions.intl",
  "php83Extensions.zip",
  "nodejs"
]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
